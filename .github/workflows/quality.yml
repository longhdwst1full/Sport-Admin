name: Admin Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Repo API là private: `contracts:check` tải contract bằng token này (thêm secret API_REPO_TOKEN,
      # quyền đọc Contents của Sport-api-doc). Thiếu secret thì bước đó báo lỗi 404 kèm hướng dẫn.
      CONTRACTS_GITHUB_TOKEN: ${{ secrets.API_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn verify
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-playwright-report
          path: |
            e2e/.report
            e2e/.artifacts
          if-no-files-found: ignore
