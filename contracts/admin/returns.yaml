components:
  schemas:
    AdminReturnQueueSummaryDto:
      type: object
      properties:
        awaitingDecision:
          type: number
          description: "REQUESTED: chờ duyệt"
        awaitingReceipt:
          type: number
          description: "APPROVED: chờ nhận hàng"
        awaitingRefund:
          type: number
          description: "RECEIVED: đã nhận hàng, chờ hoàn tiền hoặc đóng phiếu"
        awaitingClose:
          type: number
          description: "REFUNDED: chờ đóng phiếu"
        pendingRefunds:
          type: number
          description: Lượt hoàn PENDING chờ xác nhận
        overdueRefunds:
          type: number
          description: Lượt hoàn PENDING quá 24 giờ
      required:
        - awaitingDecision
        - awaitingReceipt
        - awaitingRefund
        - awaitingClose
        - pendingRefunds
        - overdueRefunds
    ApproveReturnDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
          example: "0"
        note:
          type: string
          maxLength: 500
        fault:
          description: SHOP thì hoàn thêm phí giao ban đầu (D57)
          allOf:
            - $ref: "#/components/schemas/ReturnFault"
      required:
        - expectedVersion
        - fault
    ConfirmRefundDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
          example: "0"
        externalRef:
          type: string
          maxLength: 255
          description: "Bắt buộc với BANK_TRANSFER: mã giao dịch ngân hàng. CASH: số biên nhận nếu có"
        cashHandedOver:
          type: boolean
          description: "Bắt buộc true với CASH: người xác nhận đã đưa tiền cho khách"
        proofImages:
          maxItems: 5
          description: Ảnh chứng từ (biên lai, màn hình chuyển khoản) tải lên bằng chữ ký upload chứng từ của phiếu; lưu để đối chiếu
          type: array
          items:
            $ref: "#/components/schemas/ReturnEvidenceInputDto"
      required:
        - expectedVersion
    CreateAdminReturnDto:
      type: object
      properties:
        reasonCode:
          allOf:
            - $ref: "#/components/schemas/ReturnReasonCode"
        description:
          type: string
          maxLength: 2000
        evidenceImages:
          maxItems: 5
          description: Ảnh minh chứng đã tải lên bằng chữ ký upload của đơn này. Ảnh và mô tả đều không bắt buộc
          type: array
          items:
            $ref: "#/components/schemas/ReturnEvidenceInputDto"
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/ReturnLineInputDto"
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        fault:
          description: "Bắt buộc khi người tạo có quyền return.decide: phiếu được duyệt ngay (D56)"
          allOf:
            - $ref: "#/components/schemas/ReturnFault"
        windowOverrideNote:
          type: string
          minLength: 5
          maxLength: 500
          description: Lý do nhận trả khi đã quá hạn; cần quyền return.window.override
      required:
        - reasonCode
        - items
        - orderId
    CreateAdminReturnEvidenceUploadDto:
      type: object
      properties:
        fileName:
          type: string
          example: product-front.webp
        contentType:
          example: image/webp
          allOf:
            - $ref: ./_components.yaml#/components/schemas/ImageMimeType
        sizeBytes:
          type: number
          minimum: 1
          maximum: 10485760
          example: 245760
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
      required:
        - fileName
        - contentType
        - sizeBytes
        - orderId
    CreateRefundDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
          example: "0"
        note:
          type: string
          maxLength: 500
        method:
          allOf:
            - $ref: "#/components/schemas/RefundMethod"
        amount:
          type: string
          pattern: ^\d{1,17}(\.\d{1,2})?$
          example: "570000.00"
      required:
        - expectedVersion
        - method
        - amount
    InspectReturnDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
          example: "0"
        note:
          type: string
          maxLength: 500
        items:
          minItems: 1
          description: Phải có đủ mọi dòng của phiếu
          type: array
          items:
