            - $ref: "#/components/schemas/OrderFulfillmentStatus"
        paymentMethod:
          type: string
        shippingMethod:
          type: string
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        branchName:
          type: string
        warehouseName:
          type: string
        grandTotal:
          type: string
        itemCount:
          type: number
        recipient:
          $ref: "#/components/schemas/OrderRecipientDto"
        placedAt:
          type: string
          format: date-time
        version:
          type: number
      required:
        - id
        - orderNo
        - status
        - paymentStatus
        - fulfillmentStatus
        - paymentMethod
        - shippingMethod
        - branchId
        - branchName
        - warehouseName
        - grandTotal
        - itemCount
        - recipient
        - placedAt
        - version
    PosCatalogComponentDto:
      type: object
