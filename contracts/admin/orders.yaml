          nullable: true
        actorType:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - sequenceNo
        - toStatus
        - actorType
        - createdAt
    OrderSummaryDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/OrderStatus"
        paymentStatus:
