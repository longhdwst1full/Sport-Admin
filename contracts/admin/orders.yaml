        productVariantId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sku:
          type: string
          example: HQ-909S
        name:
          type: string
          example: Giàn tạ đa năng HQ-909S
        quantity:
          type: number
          example: 2
          description: Số lượng thành phần trong một combo
      required:
