        - quantity
    PosCatalogItemDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sku:
          type: string
          example: HQ-909S
        name:
          type: string
          example: Giàn tạ đa năng HQ-909S
        unitPrice:
          type: string
          nullable: true
          example: "16000000.00"
          description: Giá bán hiện hành; null nghĩa là chưa có bảng giá hiệu lực, chưa bán được
        isBundle:
          type: boolean
          example: false
          description: Combo bán nguyên cụm, không tách lẻ
        components:
          description: Thành phần của combo; rỗng với hàng lẻ
          type: array
          items:
            $ref: "#/components/schemas/PosCatalogComponentDto"
        availableQuantity:
          type: number
          example: 3
          description: Tồn khả dụng tại kho của chi nhánh bán (đã trừ hàng đang giữ). Combo lấy theo thành phần thiếu nhất vì combo không có tồn riêng.
        flashPrice:
          type: string
          nullable: true
          example: "13900000.00"
          description: Giá flash sale đang hiệu lực; null khi không có chương trình nào áp cho SKU này. Giá cuối vẫn do Backend chốt lúc tạo đơn.
        flashSaleAvailableQuantity:
          type: number
          nullable: true
          example: 4
          description: Số suất flash còn lại. null khi không có chương trình. Suất có thể hết giữa lúc lập đơn, khi đó tạo đơn trả 409 POS_FLASH_SALE_REPRICED kèm giá gốc.
      required:
        - id
        - sku
        - name
        - unitPrice
        - isBundle
        - components
        - availableQuantity
        - flashPrice
        - flashSaleAvailableQuantity
    PosCatalogResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosCatalogItemDto"
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          example: 42
        hasMore:
          type: boolean
          example: true
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Chi nhánh đã dùng để tính tồn
      required:
        - items
        - page
        - limit
        - total
        - hasMore
        - branchId
    PosCustomerDto:
      type: object
      properties:
        name:
          type: string
          example: Nguyễn Văn An
          maxLength: 255
        phone:
          type: string
          example: "0901234567"
          description: Dùng để tìm lại khách cũ và tra cứu bảo hành sau này
        email:
          type: string
          maxLength: 255
      required:
        - name
        - phone
    PosDeliveryAddressDto:
      type: object
      properties:
        recipient:
          type: string
          example: Nguyễn Văn An
          maxLength: 255
        phone:
          type: string
          example: "0901234567"
        addressLine:
          type: string
          example: 12 Nguyễn Trãi
