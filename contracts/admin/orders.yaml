components:
  schemas:
    AdminOrderListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummaryDto"
        page:
          type: number
        limit:
          type: number
        total:
          type: number
      required:
        - items
        - page
        - limit
        - total
    CompleteOrderCommandDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: Version đơn hàng mà Admin đang xem
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: Lý do chắc chắn giao đủ và hoàn tất sớm
      required:
        - expectedVersion
        - reason
    ConfirmOrderCommandDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: Version đơn hàng mà Admin đang xem
        note:
          type: string
          maxLength: 500
          description: Ghi chú xác nhận để kho bắt đầu xử lý
      required:
        - expectedVersion
    CreatePosOrderDto:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/PosCustomerDto"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosOrderItemDto"
        paymentMethod:
          example: CASH
          allOf:
            - $ref: "#/components/schemas/PosPaymentMethod"
        delivery:
          description: "Bỏ trống: khách nhận ngay tại quầy như cũ. Có giá trị: đơn đi giao hàng, tồn kho vẫn đặt chỗ như luồng checkout của khách."
          allOf:
            - $ref: "#/components/schemas/PosDeliveryAddressDto"
        handOverImmediately:
          type: boolean
          description: Chạy luôn hết vòng giao hàng và đánh dấu đã giao. Mặc định bật cho đơn tại quầy và tắt cho đơn giao hàng; bật cho đơn giao hàng khi khách lấy ngay tại cửa hàng.
        note:
          type: string
          maxLength: 1000
          description: Ghi chú tại quầy; lưu kèm đơn để truy vết về sau
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Chi nhánh bán. BẮT BUỘC với tài khoản phạm vi toàn hệ thống vì họ không gắn chi nhánh nào. Tài khoản thuộc một chi nhánh thì bỏ trống, hoặc truyền đúng chi nhánh của mình.
      required:
        - customer
        - items
        - paymentMethod
    OrderCancelCommandDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: Version đơn hàng mà người dùng đang xem
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required:
        - expectedVersion
        - reason
    OrderDetailDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/OrderStatus"
        paymentStatus:
          allOf:
            - $ref: ./_components.yaml#/components/schemas/PaymentStatus
        fulfillmentStatus:
          allOf:
            - $ref: "#/components/schemas/OrderFulfillmentStatus"
        paymentMethod:
          type: string
        shippingMethod:
          type: string
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        branchName:
          type: string
        warehouseName:
          type: string
        grandTotal:
          type: string
        itemCount:
          type: number
        recipient:
          $ref: "#/components/schemas/OrderRecipientDto"
        placedAt:
          type: string
          format: date-time
        version:
          type: number
        currencyCode:
          type: string
        pricesIncludeTax:
          type: boolean
        subtotal:
          type: string
        discountTotal:
          type: string
        shippingTotal:
          type: string
        taxTotal:
          type: string
        customerNote:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemDto"
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusHistoryDto"
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: Lúc thanh toán được xác nhận thành công
        shipment:
          nullable: true
          description: Null khi đơn chưa có fulfillment
          type: object
          allOf:
            - $ref: "#/components/schemas/OrderShipmentDto"
      required:
        - id
        - orderNo
        - status
        - paymentStatus
        - fulfillmentStatus
        - paymentMethod
        - shippingMethod
        - branchId
        - branchName
        - warehouseName
        - grandTotal
        - itemCount
        - recipient
        - placedAt
        - version
        - currencyCode
        - pricesIncludeTax
        - subtotal
        - discountTotal
        - shippingTotal
        - taxTotal
        - items
        - statusHistory
    OrderFulfillmentStatus:
      type: string
      enum:
        - PENDING
        - PICKING
        - PACKED
        - SHIPPED
        - DELIVERED
        - FAILED
        - RETURNED
        - CANCELLED
    OrderItemComponentDto:
      type: object
      properties:
        productVariantId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sku:
          type: string
        name:
          type: string
        quantityPerBundle:
          type: number
        totalQuantity:
          type: number
      required:
        - productVariantId
        - sku
        - name
        - quantityPerBundle
        - totalQuantity
    OrderItemDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        lineNo:
          type: number
        itemType:
          type: string
        sku:
          type: string
        productName:
          type: string
        variantName:
          type: string
        imageUrl:
          type: string
          nullable: true
        quantity:
          type: number
        unitPrice:
          type: string
        lineTotal:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemComponentDto"
      required:
        - id
        - lineNo
        - itemType
        - sku
        - productName
        - variantName
        - quantity
        - unitPrice
        - lineTotal
        - components
    OrderRecipientDto:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        addressLine:
          type: string
        ward:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        province:
          type: string
      required:
        - name
        - phone
        - addressLine
        - province
    OrderShipmentDto:
      type: object
      properties:
        status:
          type: string
          description: "Trạng thái fulfillment: PENDING, PICKING, PACKED, SHIPPED, DELIVERED, DELIVERY_FAILED, RETURNED…"
        carrierCode:
          type: string
          nullable: true
          example: GHN
        trackingNo:
          type: string
          nullable: true
          example: LXQ7A9
        trackingUrl:
          type: string
          format: uri
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
      required:
