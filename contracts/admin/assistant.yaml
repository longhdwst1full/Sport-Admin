        - meta
    KnowledgeSourceType:
      type: string
      enum:
        - CMS_POST
        - MANUAL
    KnowledgeStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
    KnowledgeTransitionDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: Version đang hiển thị; lệch version trả 409
      required:
        - expectedVersion
    RejectAdminActionDraftDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: Version draft người từ chối đang xem
        reason:
