components:
  schemas:
    AdminActionDraftDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        conversationId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        actionType:
          allOf:
            - $ref: "#/components/schemas/AssistantActionDraftType"
        status:
          allOf:
            - $ref: "#/components/schemas/AssistantActionDraftStatus"
        preview:
          $ref: "#/components/schemas/StockAdjustmentDraftPreviewDto"
        payloadHash:
          type: string
          description: SHA-256 của payload; gửi lại nguyên văn khi xác nhận
          pattern: ^[0-9a-f]{64}$
        version:
          type: number
          description: Version optimistic-lock; gửi làm expectedVersion khi xác nhận/từ chối
        createdBy:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        decidedBy:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        expiresAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
        executedAt:
          type: string
          format: date-time
          nullable: true
        resultRef:
          type: string
          nullable: true
          description: Mã chứng từ nghiệp vụ khi EXECUTED (adjustmentNo)
        errorCode:
          type: string
          nullable: true
          description: Mã lỗi ổn định khi FAILED, vd INVENTORY_EXPECTED_ON_HAND_MISMATCH
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - actionType
        - status
        - preview
        - payloadHash
        - version
        - createdBy
        - expiresAt
        - createdAt
    AdminChatConversationDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        status:
          allOf:
            - $ref: "#/components/schemas/ChatConversationStatus"
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - lastMessageAt
        - createdAt
    AdminChatMessageDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        role:
          allOf:
            - $ref: "#/components/schemas/AdminChatMessageRole"
        content:
          type: string
          description: Nội dung đã che PII
        actionDraftIds:
          description: ID các bản nháp thao tác được tạo trong lượt trả lời này
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - actionDraftIds
        - createdAt
    AdminChatMessageListDto:
      type: object
      properties:
        items:
          description: Tin USER/ASSISTANT, cũ trước mới sau trong một trang
          type: array
          items:
            $ref: "#/components/schemas/AdminChatMessageDto"
        meta:
          $ref: "#/components/schemas/ChatMessageListMetaDto"
      required:
        - items
        - meta
    AdminChatMessageRole:
      type: string
      enum:
        - USER
        - ASSISTANT
    AdminChatPageContextDto:
      type: object
      properties:
        sku:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        warehouseCode:
          type: string
          maxLength: 32
          pattern: ^[A-Za-z0-9-]+$
    AssistantActionDraftStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - REJECTED
        - EXPIRED
        - EXECUTED
        - FAILED
    AssistantActionDraftType:
      type: string
      enum:
        - STOCK_ADJUSTMENT
    AttachKnowledgePostDto:
      type: object
      properties:
        postId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: ID bài CMS (posts.id)
        audience:
          allOf:
            - $ref: "#/components/schemas/KnowledgeAudience"
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
          description: null hoặc bỏ trống = áp dụng mọi chi nhánh
      required:
        - postId
        - audience
    ChatConversationStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
        - HANDED_OFF
    ChatMessageListMetaDto:
      type: object
      properties:
        limit:
          type: number
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
      required:
        - limit
        - hasMore
        - nextCursor
    ConfirmAdminActionDraftDto:
      type: object
      properties:
        payloadHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: payloadHash người xác nhận đang xem
        expectedVersion:
          type: number
          minimum: 0
          description: Version draft người xác nhận đang xem
      required:
        - payloadHash
        - expectedVersion
    KnowledgeAudience:
      type: string
      enum:
        - PUBLIC
        - CUSTOMER
        - STAFF
        - ADMIN
    KnowledgeDocumentDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sourceType:
          allOf:
            - $ref: "#/components/schemas/KnowledgeSourceType"
        sourceId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        title:
          type: string
        audience:
          allOf:
            - $ref: "#/components/schemas/KnowledgeAudience"
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        status:
          allOf:
            - $ref: "#/components/schemas/KnowledgeStatus"
        version:
          type: number
          minimum: 0
        chunkCount:
          type: number
          minimum: 0
          description: Số chunk của version hiện hành
        reindexedAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sourceType
        - sourceId
        - title
        - audience
        - branchId
        - status
        - version
        - chunkCount
        - reindexedAt
        - archivedAt
        - createdAt
        - updatedAt
    KnowledgeDocumentListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeDocumentDto"
        meta:
          $ref: ./_components.yaml#/components/schemas/PageMetaDto
      required:
