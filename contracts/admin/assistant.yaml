          $ref: "#/components/schemas/AdminChatConversationDto"
        userMessage:
          $ref: "#/components/schemas/AdminChatMessageDto"
        assistantMessage:
          $ref: "#/components/schemas/AdminChatMessageDto"
        actionDrafts:
          description: Bản nháp chờ xác nhận tạo trong lượt này (trạng thái hiện tại)
          type: array
          items:
            $ref: "#/components/schemas/AdminActionDraftDto"
      required:
        - conversation
        - userMessage
        - assistantMessage
        - actionDrafts
    StockAdjustmentDraftPreviewDto:
      type: object
      properties:
        warehouseCode:
          type: string
          example: KHO-HCM-01
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        branchName:
          type: string
          nullable: true
        sku:
          type: string
        productName:
          type: string
        currentOnHand:
          type: number
          description: Tồn vật lý lúc tạo draft; gửi làm expectedOnHand khi xác nhận
        requestedOnHand:
          type: number
          description: Tồn vật lý mong muốn sau điều chỉnh
        delta:
          type: number
          description: requestedOnHand - currentOnHand (khác 0)
        reason:
          type: string
      required:
        - warehouseCode
        - sku
        - productName
        - currentOnHand
        - requestedOnHand
        - delta
        - reason
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
