      type: object
      properties:
        channel:
          allOf:
            - $ref: "#/components/schemas/SocialChannel"
        posts:
          type: number
          minimum: 0
          description: Bản đăng PUBLISHED có giờ đăng trong khoảng
        videos:
          type: number
          minimum: 0
          description: "Trong số đó là video (TikTok: mọi bài)"
        views:
          type: number
          description: Mức tăng trong khoảng (tổng delta theo ngày từ metrics_daily)
        likes:
          type: number
        comments:
          type: number
        shares:
          type: number
        reach:
          type: number
          description: "Tổng delta reach (xấp xỉ: reach là người xem duy nhất tích luỹ). TikTok luôn 0."
      required:
        - channel
        - posts
        - videos
        - views
        - likes
        - comments
        - shares
        - reach
    SocialChannelSeriesDto:
      type: object
      properties:
        channel:
          allOf:
            - $ref: "#/components/schemas/SocialChannel"
        points:
          description: Đủ mọi ngày trong khoảng (ngày không có dữ liệu = 0)
          type: array
          items:
            $ref: "#/components/schemas/SocialDailyPointDto"
      required:
        - channel
        - points
    SocialDailyPointDto:
      type: object
      properties:
        date:
          type: string
          example: 2026-10-05
        views:
          type: number
        likes:
          type: number
        comments:
          type: number
        shares:
          type: number
        reach:
          type: number
      required:
        - date
        - views
        - likes
        - comments
        - shares
        - reach
    SocialDashboardDto:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        totals:
          type: array
          items:
            $ref: "#/components/schemas/SocialChannelKpiDto"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/SocialChannelSeriesDto"
      required:
        - from
        - to
        - totals
        - daily
    SocialMediaDto:
      type: object
      properties:
