        - excerpt
        - coverUrl
        - coverAssetId
        - publishedAt
        - status
        - version
    ContentPostType:
      type: string
      enum:
        - NEWS
        - TRAINING_GUIDE
        - PRODUCT_GUIDE
        - ABOUT
        - POLICY
    CreateBannerDto:
      type: object
      properties:
        placement:
          allOf:
            - $ref: "#/components/schemas/BannerPlacement"
        title:
          type: string
          maxLength: 255
        subtitle:
          type: string
          maxLength: 500
        ctaText:
          type: string
          maxLength: 64
          example: Mua ngay
        targetUrl:
          type: string
          maxLength: 2000
          pattern: ^(?:\/(?![/\\])\S*|https:\/\/\S+)$
          example: /danh-muc/giay-chay-bo
          description: Đường dẫn nội bộ bắt đầu bằng "/" (không phải "//") hoặc URL https.
        desktopAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Ảnh desktop (bắt buộc), phải ACTIVE trong thư viện media.
        mobileAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Ảnh mobile; bỏ trống thì storefront dùng ảnh desktop.
        categoryId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Chỉ dùng với CATEGORY_TOP; bỏ trống = hiển thị ở mọi danh mục.
        startsAt:
          type: string
          format: date-time
          description: Bỏ trống = hiệu lực ngay khi xuất bản.
        endsAt:
          type: string
          format: date-time
          description: Bỏ trống = không hết hạn.
        sortOrder:
          type: number
          default: 0
          minimum: 0
          maximum: 100000
      required:
        - placement
        - desktopAssetId
    CreateContentPostDto:
      type: object
      properties:
        postType:
          allOf:
            - $ref: "#/components/schemas/ContentPostType"
        title:
          type: string
        slug:
          type: string
          description: Đường dẫn bài viết. Bỏ trống để backend sinh từ tiêu đề.
          example: huong-dan-chon-ta-tay
        excerpt:
          type: string
        body:
          type: string
        coverUrl:
          type: string
          format: uri
          description: "URL https ảnh bìa, host thuộc: images.unsplash.com, res.cloudinary.com, baoansport.vn, www.baoansport.vn (400 CMS_COVER_URL_NOT_ALLOWED). Bị bỏ qua khi có coverAssetId — URL lúc đó lấy từ asset. Bắt buộc khi không có coverAssetId."
        coverAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Ảnh bìa từ thư viện media (phải ACTIVE và là ảnh, 409 CMS_COVER_MEDIA_INVALID). Backend đặt coverUrl = secure_url của asset.
        relatedProductSlugs:
          type: array
          items:
            type: string
      required:
        - postType
        - title
        - excerpt
        - body
    CreateFacebookDraftDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        mediaAssetIds:
          maxItems: 10
          description: Caption = nội dung bài
          type: array
          items:
            type: string
      required:
        - expectedVersion
    CreateSocialPostDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          description: Tiêu đề nội bộ; trống thì lấy dòng đầu caption
        body:
          type: string
          maxLength: 63206
          description: Caption Facebook (lưu vào body); link đặt trong caption
        mediaAssetIds:
          maxItems: 10
          description: Id media_assets theo thứ tự. Không media = bài chữ, 1-10 ảnh, hoặc đúng 1 video.
          type: array
          items:
            type: string
        channels:
          type: array
          default:
            - FACEBOOK
          description: Kênh mở bản nháp cùng lúc (mặc định chỉ FACEBOOK như trước). TIKTOK cần 0 hoặc 1 video.
          items:
            $ref: "#/components/schemas/SocialChannel"
        tiktok:
          description: Tuỳ chọn TikTok khi channels có TIKTOK
          allOf:
            - $ref: "#/components/schemas/TikTokOptionsInputDto"
      required:
        - body
    CreateTikTokDraftDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        mediaAssetIds:
          maxItems: 1
          description: Đúng một video (có thể bổ sung trước khi duyệt). Caption = nội dung bài.
          type: array
          items:
            type: string
        options:
          $ref: "#/components/schemas/TikTokOptionsInputDto"
      required:
        - expectedVersion
    DeleteFacebookDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Bắt buộc với bài đã lên Facebook (PUBLISHED/SCHEDULED); tuỳ chọn với bài chưa đăng.
      required:
        - expectedVersion
    DisconnectTikTokDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    EditLiveFacebookDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        body:
          type: string
          maxLength: 63206
          description: "Bài SOCIAL: caption mới (ghi vào body). Bỏ trống = đẩy nội dung bài hiện tại lên Facebook."
      required:
        - expectedVersion
    FacebookMetricsDto:
      type: object
      properties:
        reach:
          type: number
          nullable: true
          description: NULL = Meta không trả chỉ số hoặc chưa đồng bộ
        engagements:
          type: number
          nullable: true
          description: reactions + comments + shares
        likes:
          type: number
          nullable: true
          description: Tổng reactions (mọi loại)
        comments:
          type: number
          nullable: true
        shares:
          type: number
          nullable: true
        views:
          type: number
          nullable: true
          description: Lượt xem video/reel; NULL với bài không phải video
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: Lần job đồng bộ chỉ số gần nhất
      required:
        - reach
        - engagements
    FacebookPublicationDto:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/FacebookPublicationStatus"
        publishType:
          description: "Suy từ media (không lưu): FEED/PHOTOS/VIDEO. Reel đã đăng hiển thị là VIDEO."
          allOf:
            - $ref: "#/components/schemas/FacebookPublishType"
        origin:
          description: "Suy ra: bài SOCIAL không có người soạn = nhập từ Page."
          allOf:
            - $ref: "#/components/schemas/FacebookPublicationOrigin"
        postId:
          type: string
          example: 1234567890_9876543210
        publishAt:
          type: string
          format: date-time
          description: Giờ hẹn (SCHEDULED) hoặc giờ đăng (PUBLISHED)
        lastError:
          type: string
          description: '"CODE: message" của lỗi gần nhất'
        permalinkUrl:
          type: string
          format: uri
          maxLength: 500
          example: https://www.facebook.com/1234567890_9876543210
          description: "Link tuyệt đối (https) tới bài trên Facebook, chỉ có khi PUBLISHED: link Graph trả (video/đối soát/nhập) hoặc suy https://www.facebook.com/{postId}. Video đã đăng: đây là link chuẩn — file nguồn Cloudinary đã được dọn."
        videoProcessing:
          type: boolean
          description: true khi video/reel đã gửi Facebook và Facebook còn đang xử lý (UNCERTAIN + SOCIAL_VIDEO_PROCESSING)
        mediaCount:
          type: number
          minimum: 0
        metrics:
          $ref: "#/components/schemas/FacebookMetricsDto"
        media:
          type: array
          items:
            $ref: "#/components/schemas/SocialMediaDto"
        submittedBy:
          description: Người soạn/gửi duyệt (người duyệt chỉ có trong audit)
          allOf:
            - $ref: "#/components/schemas/SocialActorDto"
      required:
        - status
        - publishType
        - origin
        - videoProcessing
        - mediaCount
        - metrics
        - media
    FacebookPublicationOrigin:
      type: string
      enum:
        - ADMIN
        - FACEBOOK_IMPORT
    FacebookPublicationStatus:
      type: string
      enum:
        - DRAFT
        - PENDING_APPROVAL
        - SCHEDULED
        - PUBLISHING
        - UNCERTAIN
        - PUBLISHED
        - FAILED
        - DELETED
    FacebookPublicationSummaryDto:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/FacebookPublicationStatus"
        publishType:
          description: "Suy từ media (không lưu): FEED/PHOTOS/VIDEO. Reel đã đăng hiển thị là VIDEO."
          allOf:
            - $ref: "#/components/schemas/FacebookPublishType"
        origin:
          description: "Suy ra: bài SOCIAL không có người soạn = nhập từ Page."
          allOf:
            - $ref: "#/components/schemas/FacebookPublicationOrigin"
        postId:
          type: string
          example: 1234567890_9876543210
        publishAt:
          type: string
          format: date-time
          description: Giờ hẹn (SCHEDULED) hoặc giờ đăng (PUBLISHED)
        lastError:
          type: string
          description: '"CODE: message" của lỗi gần nhất'
        permalinkUrl:
          type: string
          format: uri
          maxLength: 500
          example: https://www.facebook.com/1234567890_9876543210
          description: "Link tuyệt đối (https) tới bài trên Facebook, chỉ có khi PUBLISHED: link Graph trả (video/đối soát/nhập) hoặc suy https://www.facebook.com/{postId}. Video đã đăng: đây là link chuẩn — file nguồn Cloudinary đã được dọn."
        videoProcessing:
          type: boolean
          description: true khi video/reel đã gửi Facebook và Facebook còn đang xử lý (UNCERTAIN + SOCIAL_VIDEO_PROCESSING)
        mediaCount:
          type: number
          minimum: 0
        metrics:
          $ref: "#/components/schemas/FacebookMetricsDto"
      required:
        - status
        - publishType
        - origin
        - videoProcessing
        - mediaCount
        - metrics
    FacebookPublishType:
      type: string
      enum:
        - FEED
        - PHOTOS
        - VIDEO
        - REEL
      description: "Suy từ media (không lưu): FEED/PHOTOS/VIDEO. Reel đã đăng hiển thị là VIDEO."
    FacebookReconcileResolution:
      type: string
      enum:
        - NOT_PUBLISHED
      description: NOT_PUBLISHED = Admin đã kiểm Page và xác nhận bài chưa lên → FAILED (cho phép retry)
    ReconcileFacebookDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        externalPostId:
          type: string
          example: 1234567890_9876543210
          description: ID bài Admin tìm thấy trên Page
        resolution:
          description: NOT_PUBLISHED = Admin đã kiểm Page và xác nhận bài chưa lên → FAILED (cho phép retry)
          allOf:
            - $ref: "#/components/schemas/FacebookReconcileResolution"
      required:
        - expectedVersion
    ReconcileTikTokDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        externalPostId:
          type: string
          example: "7300000000000000000"
          description: Id video Admin thấy trên TikTok → PUBLISHED
        resolution:
          description: NOT_PUBLISHED = Admin kiểm tra tài khoản TikTok và xác nhận chưa đăng → FAILED (cho phép retry)
          allOf:
            - $ref: "#/components/schemas/FacebookReconcileResolution"
      required:
        - expectedVersion
    RejectFacebookDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required:
        - expectedVersion
        - reason
    SetBannerStatusDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
          example: "0"
          description: Current optimistic-lock version
        status:
          allOf:
            - $ref: "#/components/schemas/BannerStatus"
        reason:
          type: string
          maxLength: 500
          description: Lý do đổi trạng thái; ghi vào audit.
      required:
        - expectedVersion
        - status
    SocialActorDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        displayName:
          type: string
      required:
        - id
        - displayName
    SocialChannel:
      type: string
      enum:
        - FACEBOOK
        - TIKTOK
      description: Kênh mở bản nháp cùng lúc (mặc định chỉ FACEBOOK như trước). TIKTOK cần 0 hoặc 1 video.
    SocialChannelFilter:
      type: string
      enum:
        - FACEBOOK
        - TIKTOK
        - ALL
