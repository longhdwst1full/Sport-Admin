        - ctaText
        - targetUrl
        - desktopAssetId
        - desktopImageUrl
        - mobileAssetId
        - mobileImageUrl
        - categoryId
        - categoryName
        - startsAt
        - endsAt
        - status
        - isLive
        - sortOrder
        - version
        - createdByDisplayName
        - updatedByDisplayName
        - createdAt
        - updatedAt
    BannerListDto:
