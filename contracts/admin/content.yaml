          description: Có hiển thị trên website hay không; tách khỏi status để ẩn tạm bài viết
        title:
          type: string
        excerpt:
          type: string
        coverUrl:
          type: string
          format: uri
        coverAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
          description: Asset thư viện đang làm ảnh bìa; null khi ảnh bìa là URL ngoài thư viện.
        publishedAt:
          type: string
          format: date-time
        status:
          allOf:
            - $ref: "#/components/schemas/ContentPostStatus"
        version:
          type: number
          minimum: 0
        archivedAt:
