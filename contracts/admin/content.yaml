                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
        "503":
          description: Chưa bật DB
          content:
            application/json:
              schema:
                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
      security:
        - bearer: []
      summary: Top bài đã đăng trong khoảng theo lượt xem/thích/bình luận (tối đa 50), kèm permalink
      tags:
        - Admin Content
      x-required-permissions:
        - cms.content.view
components:
