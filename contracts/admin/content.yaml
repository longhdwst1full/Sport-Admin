components:
  schemas:
    AnyContentPostType:
      type: string
      enum:
        - NEWS
        - TRAINING_GUIDE
        - PRODUCT_GUIDE
        - ABOUT
        - POLICY
        - SOCIAL
    ApproveFacebookDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        scheduledAt:
          type: string
          format: date-time
          description: Hẹn giờ đăng (Facebook tự đăng), cách hiện tại 10 phút – 30 ngày. Bỏ trống = đăng ngay.
        asReel:
          type: boolean
          default: false
          description: Đăng video dạng Reel (chỉ khi bài có đúng một video); không lưu
      required:
        - expectedVersion
    ArchiveContentPostDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
        reason:
          type: string
          minLength: 3
          maxLength: 255
          example: Nội dung không còn phù hợp
      required:
        - expectedVersion
        - reason
    BannerDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        code:
          type: string
          example: BNR-20261002-7K3F9Q2A
        placement:
          allOf:
            - $ref: "#/components/schemas/BannerPlacement"
        title:
          type: string
          nullable: true
        subtitle:
          type: string
          nullable: true
        ctaText:
          type: string
          nullable: true
        targetUrl:
          type: string
          nullable: true
        desktopAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        desktopImageUrl:
          type: string
        mobileAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        mobileImageUrl:
          type: string
          nullable: true
        categoryId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        categoryName:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        status:
          allOf:
            - $ref: "#/components/schemas/BannerStatus"
        isLive:
          type: boolean
          description: PUBLISHED và thời điểm hiện tại nằm trong khung hiệu lực.
        sortOrder:
          type: number
        version:
          type: string
          pattern: ^\d+$
          example: "0"
          description: Current optimistic-lock version
        createdByDisplayName:
          type: string
        updatedByDisplayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - placement
        - title
        - subtitle
        - ctaText
        - targetUrl
        - desktopAssetId
        - desktopImageUrl
        - mobileAssetId
        - mobileImageUrl
        - categoryId
        - categoryName
        - startsAt
        - endsAt
        - status
        - isLive
        - sortOrder
        - version
        - createdByDisplayName
        - updatedByDisplayName
        - createdAt
        - updatedAt
    BannerListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BannerDto"
        meta:
          $ref: ./_components.yaml#/components/schemas/PageMetaDto
      required:
        - items
        - meta
    BannerPlacement:
      type: string
      enum:
        - HOME_HERO
        - HOME_PROMO
        - FOOTER
        - CATEGORY_TOP
    BannerStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
    CancelFacebookDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: posts.version mà Admin đang xem
        reason:
          type: string
          maxLength: 500
      required:
        - expectedVersion
    ContentPostDto:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        postType:
          allOf:
            - $ref: "#/components/schemas/ContentPostType"
        isPublished:
          type: boolean
          example: true
          description: Có hiển thị trên website hay không; tách khỏi status để ẩn tạm bài viết
        title:
          type: string
        excerpt:
          type: string
        coverUrl:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
        status:
          allOf:
            - $ref: "#/components/schemas/ContentPostStatus"
        version:
          type: number
          minimum: 0
        archivedAt:
          type: string
          format: date-time
        archiveReason:
          type: string
        body:
          type: string
        relatedProductSlugs:
          type: array
          items:
            type: string
      required:
        - id
        - slug
        - postType
        - isPublished
        - title
        - excerpt
        - coverUrl
        - publishedAt
        - status
        - version
        - body
        - relatedProductSlugs
    ContentPostListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentPostSummaryDto"
        meta:
          $ref: ./_components.yaml#/components/schemas/PageMetaDto
      required:
        - items
        - meta
    ContentPostStatus:
      type: string
      enum:
        - PUBLISHED
        - ARCHIVED
    ContentPostSummaryDto:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        postType:
          allOf:
            - $ref: "#/components/schemas/ContentPostType"
        isPublished:
          type: boolean
          example: true
          description: Có hiển thị trên website hay không; tách khỏi status để ẩn tạm bài viết
        title:
          type: string
        excerpt:
          type: string
        coverUrl:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
        status:
          allOf:
            - $ref: "#/components/schemas/ContentPostStatus"
        version:
          type: number
          minimum: 0
        archivedAt:
          type: string
          format: date-time
        archiveReason:
          type: string
      required:
        - id
        - slug
        - postType
        - isPublished
        - title
        - excerpt
        - coverUrl
        - publishedAt
        - status
        - version
    ContentPostType:
      type: string
      enum:
        - NEWS
        - TRAINING_GUIDE
        - PRODUCT_GUIDE
        - ABOUT
        - POLICY
    CreateBannerDto:
      type: object
      properties:
        placement:
          allOf:
            - $ref: "#/components/schemas/BannerPlacement"
        title:
          type: string
          maxLength: 255
        subtitle:
          type: string
          maxLength: 500
        ctaText:
          type: string
          maxLength: 64
          example: Mua ngay
        targetUrl:
          type: string
          maxLength: 2000
          pattern: ^(?:\/(?![/\\])\S*|https:\/\/\S+)$
          example: /danh-muc/giay-chay-bo
          description: Đường dẫn nội bộ bắt đầu bằng "/" (không phải "//") hoặc URL https.
        desktopAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Ảnh desktop (bắt buộc), phải ACTIVE trong thư viện media.
        mobileAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
