        - COD
        - VNPAY
    RecordLatePaymentReceiptDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        amount:
          type: string
          example: "1490000.00"
          pattern: ^\d{1,17}(\.\d{1,2})?$
