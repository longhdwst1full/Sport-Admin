components:
  schemas:
    AssignUserRoleDto:
      type: object
      properties:
        roleCode:
          example: BRANCH_MANAGER
          allOf:
            - $ref: "#/components/schemas/AssignableStaffRoleCode"
        scopeType:
          type: string
          enum:
            - BRANCH
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
      required:
        - roleCode
        - scopeType
        - branchId
    AssignableStaffRoleCode:
      type: string
      enum:
        - BRANCH_MANAGER
        - STAFF
    CreateRoleDto:
      type: object
      properties:
        code:
          type: string
          example: WAREHOUSE_LEAD
          description: Mã vai trò, chữ in hoa và gạch dưới, duy nhất toàn hệ thống
        name:
          type: string
          example: Trưởng kho
          maxLength: 255
        description:
          type: string
          example: Phụ trách nhập xuất kho chi nhánh
          maxLength: 1000
        permissionCodes:
          example:
            - inventory.stock.view
            - inventory.stock.adjust
          type: array
          items:
            type: string
      required:
        - code
        - name
        - permissionCodes
    CreateStaffUserDto:
      type: object
      properties:
        displayName:
          type: string
          example: Nguyễn Văn An
          maxLength: 255
        email:
          type: string
          example: an.nguyen@example.com
          maxLength: 255
        roleCode:
          type: string
          enum:
            - BRANCH_MANAGER
            - STAFF
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
      required:
        - displayName
        - email
        - roleCode
        - branchId
    CreateStaffUserResponseDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        displayName:
          type: string
          example: Long Hoàng
        maskedEmail:
          type: string
          example: lo***@dctd.vn
        userType:
          type: string
          enum:
            - STAFF
            - SYSTEM
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
            - INACTIVE
        permissionVersion:
          type: number
          example: 1
        failedLoginAttempts:
          type: number
          example: 0
          minimum: 0
        mustChangePassword:
          type: boolean
          example: false
        lockedAt:
          type: string
          format: date-time
        lockReason:
          type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/UserRoleAssignmentDto"
        mfa:
          description: "Chỉ có khi người tạo giữ iam.user.mfa.manage: QR Google Authenticator (PENDING) để nhân viên quét; kích hoạt ở lần nhập OTP đúng đầu tiên khi đăng nhập"
          allOf:
            - $ref: ./_components.yaml#/components/schemas/MfaProvisioningDto
      required:
        - id
        - displayName
        - maskedEmail
        - userType
        - status
        - permissionVersion
        - failedLoginAttempts
        - mustChangePassword
        - assignments
    DeleteRoleDto:
      type: object
      properties:
        expectedVersion:
          type: number
          example: 0
          minimum: 0
          description: Version đọc được lần gần nhất
        reason:
          type: string
          example: Vai trò không còn dùng
          minLength: 3
          maxLength: 255
        fallbackRoleId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: "Vai trò ACTIVE (bất kỳ, khác vai trò đang xoá) nhận người đang giữ, cùng phạm vi. Bỏ trống: chỉ kết thúc assignment; tài khoản còn vai trò khác giữ nguyên, tài khoản không còn vai trò nào xử lý theo orphanAction."
        orphanAction:
          description: "Chỉ khi không có fallbackRoleId: DEACTIVATE (INACTIVE + thu hồi phiên) hoặc DELETE_ACCOUNT (xoá logic như deleteAdminStaffUser) cho tài khoản không còn vai trò nào khác. Bắt buộc nếu có tài khoản như vậy (thiếu -> 400 IAM_ROLE_ORPHAN_ACTION_REQUIRED). Bị bỏ qua khi có fallbackRoleId."
          allOf:
            - $ref: "#/components/schemas/RoleDeleteOrphanAction"
      required:
        - expectedVersion
        - reason
    DeleteRoleResultDto:
      type: object
      properties:
        outcome:
          description: "DELETED: xoá hẳn (không còn assignment nào tham chiếu). DEACTIVATED: còn lịch sử nên chuyển INACTIVE."
          allOf:
            - $ref: "#/components/schemas/RoleDeleteOutcome"
        fallbackRoleId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Vai trò đã nhận các assignment (echo từ request).
        orphanAction:
          description: Cách xử lý tài khoản mồ côi đã áp dụng (echo từ request khi không có fallbackRoleId).
          allOf:
            - $ref: "#/components/schemas/RoleDeleteOrphanAction"
        movedAssignments:
          type: number
          example: 2
          minimum: 0
          description: Số assignment kết thúc (REVOKED) và thay bằng fallbackRoleId cùng phạm vi
        revokedAssignments:
          type: number
          example: 0
          minimum: 0
          description: Số assignment kết thúc (REVOKED) không có vai trò thay thế
        deactivatedUsers:
          type: number
          example: 0
          minimum: 0
          description: Số tài khoản mồ côi chuyển INACTIVE (phiên bị thu hồi)
        deletedUsers:
          type: number
          example: 0
          minimum: 0
          description: Số tài khoản mồ côi bị xoá logic như deleteAdminStaffUser (LOCKED, phiên bị thu hồi)
        affectedUsers:
          type: number
          example: 2
          minimum: 0
          description: Số nhân viên bị ảnh hưởng (permissionVersion đã tăng)
      required:
        - outcome
        - movedAssignments
        - revokedAssignments
        - deactivatedUsers
        - deletedUsers
        - affectedUsers
    LockStaffUserDto:
      type: object
      properties:
        reason:
          type: string
          example: Nhân viên đã nghỉ việc
          minLength: 3
          maxLength: 255
      required:
        - reason
    PermissionDto:
      type: object
      properties:
        code:
          type: string
          example: org.branch.view
        module:
          type: string
          example: Organization
        action:
          type: string
          example: view
        sensitive:
          type: boolean
          example: false
      required:
        - code
        - module
        - action
        - sensitive
    PermissionListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
        total:
          type: number
      required:
        - items
        - total
    RevokeRoleAssignmentDto:
      type: object
      properties:
        reason:
          type: string
          example: Nhân viên chuyển sang vai trò khác
          minLength: 3
          maxLength: 255
      required:
        - reason
    RoleDeleteBlockReason:
      type: string
      enum:
        - SYSTEM_ROLE
        - OWNER_ONLY
        - HELD_BY_ACTOR
        - ALREADY_DELETED
      description: "Có khi canDelete=false: lý do để UI hiện gợi ý đúng."
    RoleDeleteOrphanAction:
      type: string
      enum:
        - DEACTIVATE
        - DELETE_ACCOUNT
      description: "Chỉ khi không có fallbackRoleId: DEACTIVATE (INACTIVE + thu hồi phiên) hoặc DELETE_ACCOUNT (xoá logic như deleteAdminStaffUser) cho tài khoản không còn vai trò nào khác. Bắt buộc nếu có tài khoản như vậy (thiếu -> 400 IAM_ROLE_ORPHAN_ACTION_REQUIRED). Bị bỏ qua khi có fallbackRoleId."
    RoleDeleteOutcome:
      type: string
      enum:
        - DELETED
        - DEACTIVATED
      description: "DELETED: xoá hẳn (không còn assignment nào tham chiếu). DEACTIVATED: còn lịch sử nên chuyển INACTIVE."
    RoleDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        code:
          type: string
          example: BRANCH_MANAGER
        name:
          type: string
          example: Branch Manager
        description:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/RoleStatus"
        system:
          type: boolean
        permissionCodes:
          type: array
          items:
            type: string
        version:
          type: number
          example: 0
        activeAssignmentCount:
          type: number
          example: 3
          minimum: 0
          description: Số assignment ACTIVE còn hiệu lực; xoá vai trò sẽ kết thúc chừng đó assignment (chuyển sang vai trò đã chọn, hoặc tài khoản bị chuyển INACTIVE)
        canDelete:
          type: boolean
          example: true
          description: "Server tính THEO NGƯỜI ĐANG XEM: false với vai trò hệ thống, khi người xem không phải OWNER phạm vi GLOBAL (chỉ OWNER được xoá vai trò), vai trò người xem đang giữ, hoặc vai trò đã ngừng không còn gì để xoá. Chỉ là gợi ý UX; DELETE vẫn tự kiểm (kể cả chốt không để hệ thống mất người nắm iam.role.manage)."
        deleteBlockedReason:
          description: "Có khi canDelete=false: lý do để UI hiện gợi ý đúng."
          allOf:
            - $ref: "#/components/schemas/RoleDeleteBlockReason"
      required:
        - id
        - code
        - name
        - status
        - system
        - permissionCodes
        - version
        - activeAssignmentCount
        - canDelete
    RoleListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleDto"
        total:
          type: number
      required:
        - items
        - total
    RoleStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    ScopeType:
      type: string
      enum:
        - GLOBAL
        - BRANCH
    StaffMfaDto:
      type: object
      properties:
        otpauthUri:
          type: string
          example: otpauth://totp/DCTD%20Admin:an%40example.com?secret=JBSWY3DPEHPK3PXP&period=30&digits=6&algorithm=SHA1&issuer=DCTD%20Admin
          description: Dựng QR từ chuỗi này để quét bằng Google Authenticator
        secret:
          type: string
          example: JBSWY3DPEHPK3PXP
          description: Secret base32 để nhập tay khi không quét được QR
        status:
          allOf:
            - $ref: ./_components.yaml#/components/schemas/MfaEnrollmentState
        confirmedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - otpauthUri
        - secret
        - status
        - confirmedAt
    StaffMfaReissueDto:
      type: object
      properties:
        otpauthUri:
          type: string
          example: otpauth://totp/DCTD%20Admin:an%40example.com?secret=JBSWY3DPEHPK3PXP&period=30&digits=6&algorithm=SHA1&issuer=DCTD%20Admin
          description: Dựng QR từ chuỗi này để quét bằng Google Authenticator
        secret:
          type: string
          example: JBSWY3DPEHPK3PXP
          description: Secret base32 để nhập tay khi không quét được QR
        revokedSessionCount:
          type: number
          example: 2
          minimum: 0
      required:
        - otpauthUri
        - secret
        - revokedSessionCount
    StaffMfaResetDto:
      type: object
      properties:
        revokedSessionCount:
          type: number
          example: 2
          minimum: 0
      required:
        - revokedSessionCount
    UpdateRoleDto:
      type: object
      properties:
        name:
          type: string
          example: Trưởng kho
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        status:
          allOf:
            - $ref: "#/components/schemas/RoleStatus"
        permissionCodes:
          description: Danh sách quyền thay thế toàn bộ. Bỏ trống để giữ nguyên quyền hiện tại.
          type: array
          items:
            type: string
        expectedVersion:
          type: number
          example: 0
          minimum: 0
          description: Version đọc được lần gần nhất
      required:
        - expectedVersion
    UserDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        displayName:
          type: string
          example: Long Hoàng
        maskedEmail:
          type: string
          example: lo***@dctd.vn
        userType:
          type: string
          enum:
            - STAFF
            - SYSTEM
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
            - INACTIVE
        permissionVersion:
          type: number
          example: 1
        failedLoginAttempts:
          type: number
          example: 0
          minimum: 0
        mustChangePassword:
          type: boolean
          example: false
        lockedAt:
          type: string
          format: date-time
        lockReason:
          type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/UserRoleAssignmentDto"
      required:
        - id
        - displayName
        - maskedEmail
        - userType
        - status
        - permissionVersion
        - failedLoginAttempts
        - mustChangePassword
        - assignments
    UserListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserDto"
        total:
          type: number
      required:
        - items
        - total
    UserRoleAssignmentDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        userId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        roleId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        roleCode:
          type: string
        scopeType:
          allOf:
            - $ref: "#/components/schemas/ScopeType"
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        status:
          type: string
          enum:
            - ACTIVE
        validFrom:
          type: string
          format: date-time
      required:
        - id
        - userId
        - roleId
        - roleCode
        - scopeType
        - status
        - validFrom
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
