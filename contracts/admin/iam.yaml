    delete:
      description: 'Vai trò hệ thống trả 403 IAM_ROLE_PROTECTED. Chỉ actor giữ OWNER ACTIVE phạm vi GLOBAL được xoá vai trò tự tạo; người khác nhận 403 IAM_ROLE_PROTECTED ("Chỉ Chủ hệ thống được xoá vai trò"). Mỗi assignment ACTIVE còn hiệu lực được kết thúc (REVOKED). Có fallbackRoleId (vai trò ACTIVE bất kỳ, khác vai trò đang xoá; sai -> 400 IAM_ROLE_FALLBACK_INVALID / 409 IAM_ROLE_FALLBACK_UNAVAILABLE): thay bằng vai trò đó cùng phạm vi (đã có thì dùng lại). Không có: tài khoản còn vai trò khác chỉ mất vai trò này; tài khoản nhân viên ACTIVE không còn vai trò nào xử lý theo orphanAction — DEACTIVATE (INACTIVE + thu hồi phiên) hoặc DELETE_ACCOUNT (xoá logic như deleteAdminStaffUser: LOCKED + thu hồi phiên); thiếu orphanAction khi có tài khoản như vậy -> 400 IAM_ROLE_ORPHAN_ACTION_REQUIRED. Vai trò luôn bị xoá trong cùng transaction. permissionVersion của người bị ảnh hưởng tăng. Chặn trong transaction: người xoá đang giữ vai trò (409 IAM_ROLE_HELD_BY_ACTOR); xoá xong (sau cả bước xử lý tài khoản) không còn nhân viên ACTIVE nào nắm iam.role.manage GLOBAL (409 IAM_ROLE_LAST_MANAGER). Còn lịch sử assignment thì vai trò chuyển INACTIVE (outcome DEACTIVATED), không thì xoá hẳn (DELETED). Lặp lại: 404 sau DELETED, no-op sau DEACTIVATED.'
      operationId: deleteAdminRole
      parameters:
        - name: roleId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRoleDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRoleResultDto"
        "400":
          description: Validation, IAM_ROLE_FALLBACK_INVALID (fallback = role itself) or IAM_ROLE_ORPHAN_ACTION_REQUIRED
