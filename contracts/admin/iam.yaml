components:
  schemas:
    AssignUserRoleDto:
      type: object
      properties:
        roleCode:
          example: BRANCH_MANAGER
          allOf:
            - $ref: "#/components/schemas/AssignableStaffRoleCode"
        scopeType:
          type: string
          enum:
            - BRANCH
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
      required:
        - roleCode
        - scopeType
        - branchId
    AssignableStaffRoleCode:
      type: string
      enum:
        - BRANCH_MANAGER
        - STAFF
    CreateRoleDto:
      type: object
      properties:
        code:
          type: string
          example: WAREHOUSE_LEAD
          description: Mã vai trò, chữ in hoa và gạch dưới, duy nhất toàn hệ thống
        name:
          type: string
          example: Trưởng kho
          maxLength: 255
        description:
          type: string
          example: Phụ trách nhập xuất kho chi nhánh
          maxLength: 1000
        permissionCodes:
          example:
            - inventory.stock.view
            - inventory.stock.adjust
          type: array
          items:
            type: string
      required:
        - code
        - name
        - permissionCodes
    CreateStaffUserDto:
      type: object
      properties:
        displayName:
          type: string
          example: Nguyễn Văn An
          maxLength: 255
        email:
          type: string
          example: an.nguyen@example.com
          maxLength: 255
        roleCode:
          type: string
          enum:
            - BRANCH_MANAGER
            - STAFF
        branchId:
          type: string
