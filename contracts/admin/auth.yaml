components:
  schemas:
    AdminLoginResponseDto:
      type: object
      properties:
        status:
          description: "AUTHENTICATED: đã cấp phiên (các trường token có mặt). MFA_REQUIRED: gọi verifyAdminMfaLogin. MFA_ENROLLMENT_REQUIRED: gọi startAdminMfaEnrollment rồi confirmAdminMfaEnrollment."
          allOf:
            - $ref: "#/components/schemas/AdminLoginStatus"
        challengeToken:
          type: string
          description: Có khi status khác AUTHENTICATED; dùng cho bước 2FA kế tiếp
        challengeExpiresIn:
          type: number
          example: 300
          description: Số giây challengeToken còn hiệu lực
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Returned only in BODY transport; COOKIE transport uses an HttpOnly cookie
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          example: 900
        mustChangePassword:
          type: boolean
          example: false
      required:
        - status
    AdminLoginStatus:
      type: string
      enum:
        - AUTHENTICATED
        - MFA_REQUIRED
        - MFA_ENROLLMENT_REQUIRED
      description: "AUTHENTICATED: đã cấp phiên (các trường token có mặt). MFA_REQUIRED: gọi verifyAdminMfaLogin. MFA_ENROLLMENT_REQUIRED: gọi startAdminMfaEnrollment rồi confirmAdminMfaEnrollment."
    AuthScopeDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - GLOBAL
            - BRANCH
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
      required:
        - type
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Leading and trailing whitespace is ignored
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Leading and trailing whitespace is ignored
      required:
        - currentPassword
        - newPassword
    ConfirmMfaEnrollmentDto:
      type: object
      properties:
        challengeToken:
          type: string
          description: challengeToken nhận từ loginAdmin
        code:
          type: string
          example: "123456"
          pattern: ^\d{6}$
      required:
        - challengeToken
        - code
    CurrentUserDto:
      type: object
      properties:
        userId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        displayName:
          type: string
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AuthScopeDto"
        permissionVersion:
          type: string
          example: "3"
          description: Changes whenever the user role/permission set changes; clients use it as a cache key for permission-derived UI such as navigation menus
        mustChangePassword:
          type: boolean
          example: false
      required:
        - userId
        - displayName
        - permissions
        - scopes
        - permissionVersion
        - mustChangePassword
    LoginDto:
      type: object
      properties:
        identifier:
          type: string
          example: owner@example.com
          description: Email or Vietnamese phone number
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Leading and trailing whitespace is ignored
        rememberMe:
          type: boolean
          example: false
          default: false
          description: Keep the refresh cookie after the browser closes. Omitted or false creates a session cookie.
      required:
        - identifier
        - password
    MfaChallengeDto:
      type: object
      properties:
        challengeToken:
          type: string
          description: challengeToken nhận từ loginAdmin
      required:
        - challengeToken
    MfaCodeDto:
      type: object
      properties:
        code:
          type: string
          example: "123456"
          pattern: ^\d{6}$
      required:
        - code
    MfaStatusDto:
      type: object
      properties:
        status:
          allOf:
            - $ref: ./_components.yaml#/components/schemas/MfaEnrollmentState
        enforced:
          type: boolean
          description: ADMIN_MFA_ENFORCED hiện hành
        exempt:
          type: boolean
          description: "Tài khoản break-glass: không cần OTP, kể cả x-mfa-code"
        confirmedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - status
        - enforced
        - exempt
        - confirmedAt
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Required in BODY transport; omitted when the refresh token is in HttpOnly cookie
    TokenPairDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Returned only in BODY transport; COOKIE transport uses an HttpOnly cookie
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          example: 900
        mustChangePassword:
          type: boolean
          example: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - mustChangePassword
    VerifyMfaLoginDto:
      type: object
      properties:
        challengeToken:
          type: string
          description: challengeToken nhận từ loginAdmin
        code:
          type: string
          example: "123456"
          pattern: ^\d{6}$
      required:
        - challengeToken
        - code
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
